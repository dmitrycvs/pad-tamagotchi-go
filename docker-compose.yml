name: tamagotchi-go

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: tamagotchi-go-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-management-service:
    image: ${DOCKERHUB_USER_FILIP}/user-management-service:${TAG_USER_MANAGEMENT:-1.0.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/user_management
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET}
      PORT: 8080
    ports:
      - "8081:8080"

  battle-service:
    image: ${DOCKERHUB_USER_FILIP}/battle-service:${TAG_BATTLE:-1.0.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/battle
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET}
      TAMAGOTCHI_SERVICE_URL: http://tamagotchi-service:8080
      USER_MANAGEMENT_SERVICE_URL: http://user-management-service:8080
      PACKAGE_REGISTRY_SERVICE_URL: http://package-registry-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      PORT: 8080
    ports:
      - "8082:8080"

  tamagotchi-service:
    image: ${DOCKERHUB_USER_DMITRII}/tamagotchi-service:${TAG_TAMAGOTCHI:-1.0.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/tamagotchi
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET}
      USER_MANAGEMENT_SERVICE_URL: http://user-management-service:8080
      PACKAGE_REGISTRY_SERVICE_URL: http://package-registry-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      PORT: 8080
    ports:
      - "8083:8080"

  notification-service:
    image: ${DOCKERHUB_USER_DMITRII}/notification-service:${TAG_NOTIFICATION:-1.0.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/notification
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON}
      PORT: 8080
    ports:
      - "8084:8080"

  map-service:
    image: ${DOCKERHUB_USER_DENIS}/pad-map-service:${TAG_MAP:-1.0.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/map
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET}
      USER_MANAGEMENT_SERVICE_URL: http://user-management-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      PROXIMITY_THRESHOLD_METERS: ${PROXIMITY_THRESHOLD_METERS:-6}
      PORT: 8080
    ports:
      - "8085:8080"

  monster-raid-service:
    image: ${DOCKERHUB_USER_DENIS}/pad-monster-raid-service:${TAG_MONSTER_RAID:-1.0.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/monster_raid
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET}
      GUILD_SERVICE_URL: http://guild-service:8080
      TAMAGOTCHI_SERVICE_URL: http://tamagotchi-service:8080
      PACKAGE_REGISTRY_SERVICE_URL: http://package-registry-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      PORT: 8080
    ports:
      - "8086:8080"

  guild-service:
    image: ${DOCKERHUB_USER_MAXIM}/guild-service:${TAG_GUILD:-1.0.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/guild
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET}
      USER_MANAGEMENT_SERVICE_URL: http://user-management-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      PORT: 8080
    ports:
      - "8087:8080"

  package-registry-service:
    image: ${DOCKERHUB_USER_MAXIM}/package-registry-service:${TAG_PACKAGE_REGISTRY:-1.0.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/package_registry
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET}
      USER_MANAGEMENT_SERVICE_URL: http://user-management-service:8080
      TAMAGOTCHI_SERVICE_URL: http://tamagotchi-service:8080
      PORT: 8080
    ports:
      - "8088:8080"

volumes:
  postgres-data:
