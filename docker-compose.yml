name: tamagotchi-go

# Looking up a stopped container's name takes Docker Desktop's resolver about 4 s; every client of the
# replicated database gives up after 1 s instead and moves on to the next host.
x-dns-opt: &dns-opt ["timeout:1", "attempts:1"]

# The C# services and the PostgreSQL nodes only call other containers: with an upstream that refuses at
# once, the same lookup fails within milliseconds. Not for Alpine images (musl retries a failed lookup)
# or for containers that call Discord or Firebase.
x-internal-dns: &internal-dns ["127.0.0.1"]

x-postgres-node: &postgres-node
  image: postgis/postgis:16-3.4
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  dns: *internal-dns
  dns_opt: *dns-opt
  entrypoint: ["bash", "/etc/tamagotchi/replication/node-entrypoint.sh"]
  # Same settings on every node: a standby needs at least the primary's max_connections, and any
  # standby may become the primary. (max_prepared_transactions is back to its default, 0: the battle
  # settlement runs as a saga on the broker since Battle 5.0.0, no service uses PREPARE TRANSACTION.)
  command:
    - postgres
    - -c
    - max_connections=200
    - -c
    - wal_level=replica
    - -c
    - max_wal_senders=10
    - -c
    - max_replication_slots=10
    - -c
    - hot_standby=on
    - -c
    - hot_standby_feedback=on           # the ETL's reads on a standby are not cancelled by vacuum
    - -c
    - wal_log_hints=on                  # pg_rewind needs it to rejoin an old primary
    - -c
    - wal_keep_size=256MB
    - -c
    - max_slot_wal_keep_size=2GB        # a standby that is away cannot fill the primary's disk
    - -c
    - recovery_target_timeline=latest   # follow a promoted standby
    - -c
    - wal_retrieve_retry_interval=1s
    - -c
    - wal_receiver_timeout=5s
    - -c
    - wal_sender_timeout=10s
    - -c
    - hba_file=/etc/tamagotchi/replication/pg_hba.conf
  environment:
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: postgres
    POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-${POSTGRES_PASSWORD}}
    CLUSTER_NODES: postgres-0,postgres-1,postgres-2
    BOOTSTRAP_NODE: postgres-0
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
    interval: 5s
    timeout: 5s
    retries: 10
    start_period: 120s

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Lab 5: cache shards. The cache-router spreads keys over them with a consistent hash ring;
  # they hold only cached copies (no persistence) and evict the least recently used key when full.
  redis-cache-1: &redis-cache
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "${CACHE_SHARD_MAXMEMORY:-64mb}", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-cache-2: *redis-cache

  redis-cache-3: *redis-cache

  cache-router:
    image: ${DOCKERHUB_USER_MAXIM:-maxkostov}/cache-router:${TAG_CACHE_ROUTER:-1.0.0}
    restart: unless-stopped
    depends_on:
      redis-cache-1:
        condition: service_healthy
      redis-cache-2:
        condition: service_healthy
      redis-cache-3:
        condition: service_healthy
      log-init:
        condition: service_completed_successfully
    environment:
      PORT: 8090
      CACHE_SHARDS: redis-cache-1:6379,redis-cache-2:6379,redis-cache-3:6379
      CACHE_VIRTUAL_NODES: ${CACHE_VIRTUAL_NODES:-150}
      CACHE_SHARD_TIMEOUT: ${CACHE_SHARD_TIMEOUT:-250ms}
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8761}
      LOG_DIR: /var/log/tamagotchi
    volumes:
      - tamagotchi-logs:/var/log/tamagotchi
    # Host port for the demo (GET /ring, /ring/simulate). Not 8090: Monster Raid publishes 8088-8090.
    ports:
      - "127.0.0.1:${CACHE_ROUTER_HOST_PORT:-8094}:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  # Lab 5: PostgreSQL primary and two hot standbys (streaming replication). postgres-0 is the first
  # primary; after a failover any node can be. Entrypoint and roles: db/replication/node-entrypoint.sh.
  postgres-0:
    <<: *postgres-node
    hostname: postgres-0
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # The volume of the single Lab 1-4 instance, so existing data is kept.
      - postgres-data:/var/lib/postgresql/data
      - postgres-cluster:/cluster:ro
      - ./db/replication:/etc/tamagotchi/replication:ro
      - ./db/init:/docker-entrypoint-initdb.d:ro

  postgres-1:
    <<: *postgres-node
    hostname: postgres-1
    ports:
      - "127.0.0.1:${POSTGRES_1_PORT:-5434}:5432"
    volumes:
      - postgres-1-data:/var/lib/postgresql/data
      - postgres-cluster:/cluster:ro
      - ./db/replication:/etc/tamagotchi/replication:ro

  postgres-2:
    <<: *postgres-node
    hostname: postgres-2
    ports:
      - "127.0.0.1:${POSTGRES_2_PORT:-5435}:5432"
    volumes:
      - postgres-2-data:/var/lib/postgresql/data
      - postgres-cluster:/cluster:ro
      - ./db/replication:/etc/tamagotchi/replication:ro

  # Promotes the most advanced standby when the primary fails three checks in a row (db/failover).
  # Healthy while some node accepts writes: every service waits for this instead of for one node.
  postgres-failover:
    image: postgres:16-alpine
    init: true
    restart: unless-stopped
    dns_opt: *dns-opt
    entrypoint: ["sh", "/etc/tamagotchi/failover/failover.sh"]
    depends_on:
      log-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CLUSTER_NODES: postgres-0,postgres-1,postgres-2
      FAILOVER_CHECK_INTERVAL_SECONDS: ${FAILOVER_CHECK_INTERVAL_SECONDS:-2}
      FAILOVER_FAILURE_THRESHOLD: ${FAILOVER_FAILURE_THRESHOLD:-3}
      FAILOVER_STARTUP_GRACE_SECONDS: ${FAILOVER_STARTUP_GRACE_SECONDS:-30}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      LOG_DIR: /var/log/tamagotchi
    volumes:
      - postgres-cluster:/cluster
      - ./db/failover:/etc/tamagotchi/failover:ro
      - tamagotchi-logs:/var/log/tamagotchi
    healthcheck:
      test: ["CMD", "sh", "/etc/tamagotchi/failover/failover.sh", "check"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s

  service-discovery:
    image: ${DOCKERHUB_USER_MAXIM:-maxkostov}/service-discovery:${TAG_SERVICE_DISCOVERY:-3.6.0}
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - tamagotchi-logs:/var/log/tamagotchi
    depends_on:
      log-init:
        condition: service_completed_successfully
    environment:
      JAVA_OPTS: ${DISCOVERY_JAVA_OPTS:--Xms64m -Xmx256m -XX:ActiveProcessorCount=2}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_MIN_INTERVAL: ${DISCORD_MIN_INTERVAL:-5s}
      DISCORD_TIMEOUT: ${DISCORD_TIMEOUT:-3s}
      DISCORD_DEDUP_WINDOW: ${DISCORD_DEDUP_WINDOW:-60s}
      DISCORD_QUEUE_CAPACITY: ${DISCORD_QUEUE_CAPACITY:-100}
      LOGGING_FILE_NAME: /var/log/tamagotchi/service-discovery.log
      PORT: 8761
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-100}
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 150s

  api-gateway:
    image: ${DOCKERHUB_USER_DMITRII:-dmitrycvs}/api-gateway:${TAG_GATEWAY:-5.0.0}
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - tamagotchi-logs:/var/log/tamagotchi
    depends_on:
      message-broker:
        condition: service_healthy
    environment:
      JAVA_OPTS: ${GATEWAY_JAVA_OPTS:--Xms64m -Xmx256m -XX:ActiveProcessorCount=2}
      LOGGING_FILE_NAME: /var/log/tamagotchi/api-gateway.log
      # Served to admins as a zip by GET /api/admin/logs.
      LOG_ARCHIVE_DIR: /var/log/tamagotchi
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET}
      GATEWAY_FORWARD_AUTHORIZATION: ${GATEWAY_FORWARD_AUTHORIZATION:-false}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:?Set GATEWAY_SHARED_SECRET in .env}
      MESSAGE_BROKER_URL: http://message-broker:8070
      GATEWAY_REQUEST_TIMEOUT: ${GATEWAY_REQUEST_TIMEOUT:-12s}
      GATEWAY_MAX_CONCURRENT_REQUESTS: ${GATEWAY_MAX_CONCURRENT_REQUESTS:-200}
      # Route hosts name request queues; MESSAGE_BROKER_URL delegates HTTP selection and delivery.
      UPSTREAM_USER_MANAGEMENT_URL: http://user-management-service:8080
      UPSTREAM_BATTLE_URL: http://battle-service:8080
      UPSTREAM_TAMAGOTCHI_URL: http://tamagotchi-service:8080
      UPSTREAM_NOTIFICATION_URL: http://notification-service:8080
      UPSTREAM_MAP_URL: http://map-service:8080
      UPSTREAM_MONSTER_RAID_URL: http://monster-raid-service:8080
      UPSTREAM_GUILD_URL: http://guild-service:8080
      UPSTREAM_PACKAGE_REGISTRY_URL: http://package-registry-service:8080
      # Handed to clients by POST /api/realtime/...: they connect to these directly.
      WS_PUBLIC_URL_BATTLE: ${WS_PUBLIC_URL_BATTLE:-ws://localhost:8082}
      WS_PUBLIC_URL_MAP: ${WS_PUBLIC_URL_MAP:-ws://localhost:8085}
      WS_PUBLIC_URL_MONSTER_RAID: ${WS_PUBLIC_URL_MONSTER_RAID:-ws://localhost:8088}
      WS_PUBLIC_URL_GUILD: ${WS_PUBLIC_URL_GUILD:-ws://localhost:8091}
      WS_PUBLIC_INSTANCE_URLS: '${WS_PUBLIC_INSTANCE_URLS:-{}}'
      CACHE_ROUTER_URL: ${CACHE_ROUTER_URL:-http://cache-router:8090}
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8761}
      PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 150s

  user-management-service:
    image: ${DOCKERHUB_USER_FILIP:-filipel2004}/user-management-service:${TAG_USER_MANAGEMENT:-5.0.0}
    platform: linux/amd64
    restart: unless-stopped
    dns: *internal-dns
    dns_opt: *dns-opt
    depends_on:
      message-broker:
        condition: service_healthy
      postgres-failover:
        condition: service_healthy
      log-init:
        condition: service_completed_successfully
    volumes:
      - tamagotchi-logs:/var/log/tamagotchi
    environment:
      CIRCUIT_BREAKER_COOLDOWN_SECONDS: ${CIRCUIT_BREAKER_COOLDOWN_SECONDS:-5}
      DATABASE_URL: Host=postgres-0,postgres-1,postgres-2;Port=5432;Database=user_management;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Target Session Attributes=primary;Host Recheck Seconds=1;Timeout=3
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET}
      NOTIFICATION_SERVICE_URL: http://message-broker:8070/q/notification-service
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-8}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-100}
      CACHE_ROUTER_URL: ${CACHE_ROUTER_URL:-http://cache-router:8090}
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8761}
      PORT: 8080
      # Lab 4: friend requests fire user.friend_request_received through the broker (gRPC Broker.Publish), the
      # broker reaches each replica's gRPC Consumer on 9000, and logs also go to the shared volume.
      BROKER_GRPC_URL: http://message-broker:9070
      MESSAGE_BROKER_URL: http://message-broker:8070
      GRPC_PORT: 9000
      LOG_DIR: /var/log/tamagotchi
    deploy:
      replicas: ${REPLICAS_USER_MANAGEMENT:-2}

  battle-service:
    image: ${DOCKERHUB_USER_FILIP:-filipel2004}/battle-service:${TAG_BATTLE:-5.0.1}
    platform: linux/amd64
    restart: unless-stopped
    dns: *internal-dns
    dns_opt: *dns-opt
    depends_on:
      message-broker:
        condition: service_healthy
      postgres-failover:
        condition: service_healthy
      log-init:
        condition: service_completed_successfully
    volumes:
      - tamagotchi-logs:/var/log/tamagotchi
    environment:
      CIRCUIT_BREAKER_COOLDOWN_SECONDS: ${CIRCUIT_BREAKER_COOLDOWN_SECONDS:-5}
      DATABASE_URL: Host=postgres-0,postgres-1,postgres-2;Port=5432;Database=battle;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Target Session Attributes=primary;Host Recheck Seconds=1;Timeout=3
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET}
      TAMAGOTCHI_SERVICE_URL: http://message-broker:8070/q/tamagotchi-service
      USER_MANAGEMENT_SERVICE_URL: http://message-broker:8070/q/user-management-service
      PACKAGE_REGISTRY_SERVICE_URL: http://message-broker:8070/q/package-registry-service
      NOTIFICATION_SERVICE_URL: http://message-broker:8070/q/notification-service
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-8}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-100}
      CACHE_ROUTER_URL: ${CACHE_ROUTER_URL:-http://cache-router:8090}
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8761}
      PORT: 8080
      # Lab 4: peer calls go through Broker.Call (gRPC), battle requests fire battle.request_received, the broker
      # reaches each replica's gRPC Consumer on 9000, and logs also go to the shared volume.
      BROKER_GRPC_URL: http://message-broker:9070
      MESSAGE_BROKER_URL: http://message-broker:8070
      GRPC_PORT: 9000
      LOG_DIR: /var/log/tamagotchi
    deploy:
      replicas: ${REPLICAS_BATTLE:-2}
    # One host port per replica (up to 3) for direct WebSocket connections.
    ports:
      - "8082-8084:8080"

  tamagotchi-service:
    image: ${DOCKERHUB_USER_DMITRII:-dmitrycvs}/tamagotchi-service:${TAG_TAMAGOTCHI:-4.1.0}
    platform: linux/amd64
    restart: unless-stopped
    dns_opt: *dns-opt
    depends_on:
      message-broker:
        condition: service_healthy
      postgres-failover:
        condition: service_healthy
      log-init:
        condition: service_completed_successfully
    volumes:
      - tamagotchi-logs:/var/log/tamagotchi
    environment:
      CIRCUIT_BREAKER_COOLDOWN_SECONDS: ${CIRCUIT_BREAKER_COOLDOWN_SECONDS:-5}
      LOG_DIR: /var/log/tamagotchi
      # Events go to broker topics (tamagotchi.captured) instead of NOTIFICATION_SERVICE_URL.
      MESSAGE_BROKER_URL: http://message-broker:8070
      # gRPC (4.1.0+): Consumer server registered as grpc_port; peer calls and events go to the
      # broker over gRPC. Older images ignore both.
      GRPC_PORT: 9000
      BROKER_GRPC_URL: message-broker:9070
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-0:5432,postgres-1:5432,postgres-2:5432/tamagotchi?target_session_attrs=read-write
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-}
      # This service reads a Go duration, so the team's seconds value gets an "s".
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT_SECONDS:-8}s
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-100}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET}
      USER_MANAGEMENT_SERVICE_URL: http://message-broker:8070/q/user-management-service
      PACKAGE_REGISTRY_SERVICE_URL: http://message-broker:8070/q/package-registry-service
      NOTIFICATION_SERVICE_URL: http://message-broker:8070/q/notification-service
      CACHE_ROUTER_URL: ${CACHE_ROUTER_URL:-http://cache-router:8090}
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8761}
      PORT: 8080
    deploy:
      replicas: ${REPLICAS_TAMAGOTCHI:-2}

  notification-service:
    image: ${DOCKERHUB_USER_DMITRII:-dmitrycvs}/notification-service:${TAG_NOTIFICATION:-4.1.0}
    platform: linux/amd64
    restart: unless-stopped
    dns_opt: *dns-opt
    depends_on:
      message-broker:
        condition: service_healthy
      postgres-failover:
        condition: service_healthy
      log-init:
        condition: service_completed_successfully
    volumes:
      - tamagotchi-logs:/var/log/tamagotchi
    environment:
      CIRCUIT_BREAKER_COOLDOWN_SECONDS: ${CIRCUIT_BREAKER_COOLDOWN_SECONDS:-5}
      LOG_DIR: /var/log/tamagotchi
      # gRPC (4.1.0+): Consumer server registered as grpc_port, so topic events arrive over gRPC.
      GRPC_PORT: 9000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-0:5432,postgres-1:5432,postgres-2:5432/notification?target_session_attrs=read-write
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-}
      # This service reads a Go duration, so the team's seconds value gets an "s".
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT_SECONDS:-8}s
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-100}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON}
      CACHE_ROUTER_URL: ${CACHE_ROUTER_URL:-http://cache-router:8090}
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8761}
      PORT: 8080
    deploy:
      replicas: ${REPLICAS_NOTIFICATION:-2}

  map-service:
    image: ${DOCKERHUB_USER_DENIS:-takima}/pad-map-service:${TAG_MAP:-2.4.0}
    platform: linux/amd64
    restart: unless-stopped
    dns: *internal-dns
    dns_opt: *dns-opt
    depends_on:
      message-broker:
        condition: service_healthy
      postgres-failover:
        condition: service_healthy
      log-init:
        condition: service_completed_successfully
    volumes:
      - tamagotchi-logs:/var/log/tamagotchi
    environment:
      CIRCUIT_BREAKER_COOLDOWN_SECONDS: ${CIRCUIT_BREAKER_COOLDOWN_SECONDS:-5}
      # JSON log lines in /var/log/tamagotchi/map-service/<instance_id>.log.
      LOG_DIR: /var/log/tamagotchi
      # Consumer server for the broker (registered as grpc_port); peer calls and topic events
      # (map.nearby_player_detected) go to the broker over gRPC.
      GRPC_PORT: 9000
      BROKER_GRPC_URL: http://message-broker:9070
      MESSAGE_BROKER_URL: http://message-broker:8070
      DATABASE_URL: Host=postgres-0,postgres-1,postgres-2;Port=5432;Database=map;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Target Session Attributes=primary;Host Recheck Seconds=1;Timeout=3
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-8}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-100}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-}
      USER_MANAGEMENT_SERVICE_URL: http://message-broker:8070/q/user-management-service
      NOTIFICATION_SERVICE_URL: http://message-broker:8070/q/notification-service
      PROXIMITY_THRESHOLD_METERS: ${PROXIMITY_THRESHOLD_METERS:-6}
      CACHE_ROUTER_URL: ${CACHE_ROUTER_URL:-http://cache-router:8090}
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8761}
      PORT: 8080
    deploy:
      replicas: ${REPLICAS_MAP:-2}
    # One host port per replica (up to 3) for direct WebSocket connections.
    ports:
      - "8085-8087:8080"

  monster-raid-service:
    image: ${DOCKERHUB_USER_DENIS:-takima}/pad-monster-raid-service:${TAG_MONSTER_RAID:-2.4.0}
    platform: linux/amd64
    restart: unless-stopped
    dns: *internal-dns
    dns_opt: *dns-opt
    depends_on:
      message-broker:
        condition: service_healthy
      postgres-failover:
        condition: service_healthy
      log-init:
        condition: service_completed_successfully
    volumes:
      - tamagotchi-logs:/var/log/tamagotchi
    environment:
      CIRCUIT_BREAKER_COOLDOWN_SECONDS: ${CIRCUIT_BREAKER_COOLDOWN_SECONDS:-5}
      # JSON log lines in /var/log/tamagotchi/monster-raid-service/<instance_id>.log.
      LOG_DIR: /var/log/tamagotchi
      # Consumer server for the broker (registered as grpc_port); peer calls and topic events
      # (raid.started) go to the broker over gRPC.
      GRPC_PORT: 9000
      BROKER_GRPC_URL: http://message-broker:9070
      MESSAGE_BROKER_URL: http://message-broker:8070
      DATABASE_URL: Host=postgres-0,postgres-1,postgres-2;Port=5432;Database=monster_raid;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Target Session Attributes=primary;Host Recheck Seconds=1;Timeout=3
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-8}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-100}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-}
      GUILD_SERVICE_URL: http://message-broker:8070/q/guild-service
      TAMAGOTCHI_SERVICE_URL: http://message-broker:8070/q/tamagotchi-service
      PACKAGE_REGISTRY_SERVICE_URL: http://message-broker:8070/q/package-registry-service
      NOTIFICATION_SERVICE_URL: http://message-broker:8070/q/notification-service
      CACHE_ROUTER_URL: ${CACHE_ROUTER_URL:-http://cache-router:8090}
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8761}
      PORT: 8080
    deploy:
      replicas: ${REPLICAS_MONSTER_RAID:-2}
    # One host port per replica (up to 3) for direct WebSocket connections.
    ports:
      - "8088-8090:8080"

  guild-service:
    image: ${DOCKERHUB_USER_MAXIM:-maxkostov}/guild-service:${TAG_GUILD:-3.3.0}
    platform: linux/amd64
    restart: unless-stopped
    dns_opt: *dns-opt
    depends_on:
      message-broker:
        condition: service_healthy
      postgres-failover:
        condition: service_healthy
    volumes:
      - tamagotchi-logs:/var/log/tamagotchi
    environment:
      LOG_DIR: /var/log/tamagotchi
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-3}
      CIRCUIT_BREAKER_WINDOW_SECONDS: ${CIRCUIT_BREAKER_WINDOW_SECONDS:-}
      CIRCUIT_BREAKER_COOLDOWN_SECONDS: ${CIRCUIT_BREAKER_COOLDOWN_SECONDS:-5}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GUILD_REDIS_CHANNEL: ${GUILD_REDIS_CHANNEL:-tamagotchi:guild:events}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-0:5432,postgres-1:5432,postgres-2:5432/guild?target_session_attrs=read-write
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:?Set GATEWAY_SHARED_SECRET in .env}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-8}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-100}
      API_GATEWAY_URL: http://api-gateway:8080
      USER_MANAGEMENT_SERVICE_URL: http://message-broker:8070/q/user-management-service
      NOTIFICATION_SERVICE_URL: http://message-broker:8070/q/notification-service
      CACHE_ROUTER_URL: ${CACHE_ROUTER_URL:-http://cache-router:8090}
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8761}
      GRPC_PORT: 9000
      BROKER_GRPC_URL: http://message-broker:9070
      PORT: 8080
    deploy:
      replicas: ${REPLICAS_GUILD:-2}
    # One host port per replica (up to 3) for direct WebSocket connections.
    ports:
      - "8091-8093:8080"

  package-registry-service:
    image: ${DOCKERHUB_USER_MAXIM:-maxkostov}/package-registry-service:${TAG_PACKAGE_REGISTRY:-3.3.0}
    platform: linux/amd64
    restart: unless-stopped
    dns_opt: *dns-opt
    depends_on:
      message-broker:
        condition: service_healthy
      postgres-failover:
        condition: service_healthy
    volumes:
      - tamagotchi-logs:/var/log/tamagotchi
    environment:
      LOG_DIR: /var/log/tamagotchi
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-3}
      CIRCUIT_BREAKER_WINDOW_SECONDS: ${CIRCUIT_BREAKER_WINDOW_SECONDS:-}
      CIRCUIT_BREAKER_COOLDOWN_SECONDS: ${CIRCUIT_BREAKER_COOLDOWN_SECONDS:-5}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-0:5432,postgres-1:5432,postgres-2:5432/package_registry?target_session_attrs=read-write
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:?Set GATEWAY_SHARED_SECRET in .env}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-8}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-100}
      USER_MANAGEMENT_SERVICE_URL: http://message-broker:8070/q/user-management-service
      TAMAGOTCHI_SERVICE_URL: http://message-broker:8070/q/tamagotchi-service
      CACHE_ROUTER_URL: ${CACHE_ROUTER_URL:-http://cache-router:8090}
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8761}
      GRPC_PORT: 9000
      BROKER_GRPC_URL: http://message-broker:9070
      PORT: 8080
    deploy:
      replicas: ${REPLICAS_PACKAGE_REGISTRY:-2}

  # Lab 5: the data warehouse, a separate PostgreSQL that is not replicated (it can be rebuilt by the ETL).
  data-warehouse:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DW_USER:-${POSTGRES_USER}}
      POSTGRES_PASSWORD: ${DW_PASSWORD:-${POSTGRES_PASSWORD}}
      POSTGRES_DB: tamagotchi_dw
    ports:
      - "127.0.0.1:${DW_PORT:-5433}:5432"
    volumes:
      - data-warehouse-data:/var/lib/postgresql/data
      - ./db/warehouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, because the schema scripts run on a server that listens only on the socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DW_USER:-${POSTGRES_USER}} -d tamagotchi_dw"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Extracts from the service databases (from a standby), transforms into the star schema and loads
  # tamagotchi_dw every ETL_INTERVAL. Internal: service JWT, not routed by the gateway.
  etl-service:
    image: ${DOCKERHUB_USER_DENIS:-takima}/etl-service:${TAG_ETL:-1.0.0}
    platform: linux/amd64
    restart: unless-stopped
    dns: *internal-dns
    dns_opt: *dns-opt
    depends_on:
      postgres-failover:
        condition: service_healthy
      data-warehouse:
        condition: service_healthy
      log-init:
        condition: service_completed_successfully
    volumes:
      - tamagotchi-logs:/var/log/tamagotchi
    environment:
      LOG_DIR: /var/log/tamagotchi
      SOURCE_DATABASE_URL: Host=postgres-0,postgres-1,postgres-2;Port=5432;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Target Session Attributes=prefer-standby;Host Recheck Seconds=1;Timeout=3
      WAREHOUSE_DATABASE_URL: Host=data-warehouse;Port=5432;Database=tamagotchi_dw;Username=${DW_USER:-${POSTGRES_USER}};Password=${DW_PASSWORD:-${POSTGRES_PASSWORD}}
      ETL_INTERVAL: ${ETL_INTERVAL:-5m}
      ETL_OVERLAP: ${ETL_OVERLAP:-2m}
      ETL_LOOKBACK: ${ETL_LOOKBACK:-24h}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET}
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8761}
      PORT: 8080
    # Host port for the demo (POST /api/etl/runs).
    ports:
      - "127.0.0.1:${ETL_HOST_PORT:-8095}:8080"

  log-init:
    image: busybox:1.37.0
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "chown 1000:1000 /var/log/tamagotchi && chmod 1777 /var/log/tamagotchi"]
    volumes:
      - tamagotchi-logs:/var/log/tamagotchi

  message-broker:
    image: ${DOCKERHUB_USER_MAXIM:-maxkostov}/message-broker:${TAG_MESSAGE_BROKER:-1.4.0}
    platform: linux/amd64
    restart: unless-stopped
    dns_opt: *dns-opt
    depends_on:
      service-discovery:
        condition: service_healthy
      postgres-failover:
        condition: service_healthy
      log-init:
        condition: service_completed_successfully
    environment:
      JAVA_OPTS: ${BROKER_JAVA_OPTS:--Xms64m -Xmx256m -XX:ActiveProcessorCount=2}
      PORT: 8070
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8761}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:?Set GATEWAY_SHARED_SECRET in .env}
      # Lab 4 step 4: durable queues and the dead letter channel (broker 1.3.0+; older images ignore these).
      # Broker 1.4.0 takes a host list and follows the primary after a failover (README, Lab 5).
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-0:5432,postgres-1:5432,postgres-2:5432/message_broker?target_session_attrs=read-write
      # Lab 5 saga transactions (broker 1.4.0): POST /api/transactions; the saga log is in the same database.
      BROKER_SAGA_WAIT: ${BROKER_SAGA_WAIT:-10s}
      BROKER_SAGA_STEP_ATTEMPTS: ${BROKER_SAGA_STEP_ATTEMPTS:-5}
      BROKER_SAGA_COMPENSATION_ATTEMPTS: ${BROKER_SAGA_COMPENSATION_ATTEMPTS:-10}
      BROKER_RETRY_MAX_ATTEMPTS: ${BROKER_RETRY_MAX_ATTEMPTS:-5}
      BROKER_RETRY_INITIAL_BACKOFF: ${BROKER_RETRY_INITIAL_BACKOFF:-1s}
      BROKER_RETRY_MAX_BACKOFF: ${BROKER_RETRY_MAX_BACKOFF:-60s}
      BROKER_REQUEST_TIMEOUT: ${BROKER_REQUEST_TIMEOUT:-10s}
      BROKER_CONNECT_TIMEOUT: ${BROKER_CONNECT_TIMEOUT:-2s}
      BROKER_MAX_CONCURRENT_REQUESTS: ${BROKER_MAX_CONCURRENT_REQUESTS:-200}
      BROKER_QUEUE_CAPACITY: ${BROKER_QUEUE_CAPACITY:-100}
      # Thread-per-request pools; 0 = BROKER_MAX_CONCURRENT_REQUESTS + 16.
      BROKER_WORKER_THREADS: ${BROKER_WORKER_THREADS:-0}
      BROKER_GRPC_THREADS: ${BROKER_GRPC_THREADS:-0}
      BROKER_GRPC_PORT: 9070
      DISCOVERY_REFRESH_INTERVAL: ${DISCOVERY_REFRESH_INTERVAL:-5s}
      DISCOVERY_HEARTBEAT_INTERVAL: ${DISCOVERY_HEARTBEAT_INTERVAL:-10s}
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-3}
      CIRCUIT_BREAKER_WINDOW: ${CIRCUIT_BREAKER_WINDOW:-}
      # A database failover fails every replica for a few seconds and opens their breakers; a short
      # cooldown probes them again as soon as the new primary is up (default would be the 35 s window).
      CIRCUIT_BREAKER_COOLDOWN: ${CIRCUIT_BREAKER_COOLDOWN:-5s}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_MIN_INTERVAL: ${DISCORD_MIN_INTERVAL:-5s}
      DISCORD_TIMEOUT: ${DISCORD_TIMEOUT:-3s}
      DISCORD_DEDUP_WINDOW: ${DISCORD_DEDUP_WINDOW:-60s}
      DISCORD_QUEUE_CAPACITY: ${DISCORD_QUEUE_CAPACITY:-100}
      LOG_DIR: /var/log/tamagotchi
    ports:
      - "127.0.0.1:8070:8070"
      # gRPC (proto/broker.proto): services call Broker here; the broker calls their port 9000.
      - "127.0.0.1:9070:9070"
    volumes:
      - tamagotchi-logs:/var/log/tamagotchi
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8070/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 150s

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    depends_on:
      message-broker:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  loki:
    image: grafana/loki:3.7.9
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki

  loki-ready:
    image: busybox:1.37.0
    restart: "no"
    depends_on:
      loki:
        condition: service_started
    command: ["sh", "-c", "until wget -qO- http://loki:3100/ready > /dev/null; do sleep 1; done"]

  alloy:
    image: grafana/alloy:v1.21.3
    restart: unless-stopped
    user: "0:0"
    depends_on:
      loki-ready:
        condition: service_completed_successfully
      log-init:
        condition: service_completed_successfully
    command: ["run", "--storage.path=/var/lib/alloy", "/etc/alloy/config.alloy"]
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - tamagotchi-logs:/var/log/tamagotchi:ro
      - alloy-data:/var/lib/alloy

  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
      loki-ready:
        condition: service_completed_successfully
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  # postgres-0 (the volume of the single instance before Lab 5)
  postgres-data:
  postgres-1-data:
  postgres-2-data:
  # Name of the current primary, written by postgres-failover
  postgres-cluster:
  data-warehouse-data:
  tamagotchi-logs:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
