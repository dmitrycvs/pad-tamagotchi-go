<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Tamagotchi Go architecture (Lab 3). Source of src/application_diagram.png. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1400" height="1000" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="50" font-size="26" font-weight="700" fill="#0f172a">Tamagotchi Go — architecture</text>
  <text x="40" y="76" font-size="14" fill="#64748b">Lab 3: every service runs as several replicas, registers with Service Discovery and is reached round-robin through the gateway</text>

  <!-- Clients -->
  <rect x="560" y="100" width="280" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="700" y="128" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">Clients (package apps)</text>
  <text x="700" y="149" text-anchor="middle" font-size="12.5" fill="#64748b">REST with JWT · WebSocket for live data</text>

  <!-- Client -> Gateway -->
  <line x1="700" y1="164" x2="700" y2="214" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="712" y="194" font-size="12.5" fill="#475569">REST / JWT</text>

  <!-- API Gateway -->
  <rect x="470" y="216" width="460" height="128" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="494" y="247" font-size="19" font-weight="700" fill="#1e3a8a">API Gateway</text>
  <text x="612" y="247" font-size="14" fill="#3b82f6">:8080</text>
  <rect x="842" y="230" width="68" height="22" rx="11" fill="#fff7ed" stroke="#ea580c"/>
  <text x="876" y="245" text-anchor="middle" font-size="12" font-weight="600" fill="#c2410c">Java</text>
  <text x="494" y="273" font-size="13.5" fill="#1e293b">• JWT check, trusted identity headers to services</text>
  <text x="494" y="294" font-size="13.5" fill="#1e293b">• Round-robin over registered instances</text>
  <text x="494" y="315" font-size="13.5" fill="#1e293b">• Circuit breaker per instance, removes failed ones</text>
  <text x="494" y="336" font-size="13.5" fill="#1e293b">• WebSocket negotiation → URL of one instance</text>

  <!-- Service Discovery -->
  <rect x="1060" y="216" width="300" height="148" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082" y="247" font-size="19" font-weight="700" fill="#4c1d95">Service Discovery</text>
  <text x="1082" y="268" font-size="14" fill="#8b5cf6">:8761</text>
  <rect x="1272" y="230" width="68" height="22" rx="11" fill="#fff7ed" stroke="#ea580c"/>
  <text x="1306" y="245" text-anchor="middle" font-size="12" font-weight="600" fill="#c2410c">Java</text>
  <text x="1082" y="294" font-size="13.5" fill="#1e293b">• Registry of running instances</text>
  <text x="1082" y="315" font-size="13.5" fill="#1e293b">• Drops an instance after 30 s</text>
  <text x="1096" y="333" font-size="13.5" fill="#1e293b">without a heartbeat</text>
  <text x="1082" y="354" font-size="13.5" fill="#1e293b">• Polls /health, raises load alerts</text>

  <!-- Gateway <-> Service Discovery -->
  <line x1="1058" y1="262" x2="934" y2="262" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-violet)"/>
  <text x="996" y="254" text-anchor="middle" font-size="12" fill="#6d28d9">instance list</text>
  <text x="996" y="282" text-anchor="middle" font-size="12" fill="#6d28d9">every 5 s</text>
  <line x1="932" y1="318" x2="1056" y2="318" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-violet)"/>
  <text x="996" y="338" text-anchor="middle" font-size="12" fill="#6d28d9">remove tripped</text>

  <!-- Discord -->
  <rect x="1090" y="604" width="270" height="72" rx="10" fill="#ffffff" stroke="#5865f2" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1225" y="633" text-anchor="middle" font-size="16" font-weight="600" fill="#3730a3">Discord (developers)</text>
  <text x="1225" y="655" text-anchor="middle" font-size="12" fill="#64748b">health alerts · breaker trips · removals</text>
  <line x1="1300" y1="366" x2="1300" y2="600" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-violet)"/>
  <text x="1310" y="480" font-size="12" fill="#6d28d9">alerts</text>

  <!-- Gateway <-> services -->
  <line x1="760" y1="346" x2="760" y2="424" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="772" y="378" font-size="12.5" fill="#475569">REST, round-robin</text>
  <text x="772" y="396" font-size="12" fill="#64748b">X-Upstream-Instance</text>
  <line x1="640" y1="424" x2="640" y2="348" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="628" y="378" text-anchor="end" font-size="12.5" fill="#475569">service-to-service calls</text>
  <text x="628" y="396" text-anchor="end" font-size="12" fill="#64748b">circuit breaker per peer</text>

  <!-- Client WebSocket, direct to an instance -->
  <path d="M558,132 L200,132 L200,422" fill="none" stroke="#0d9488" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-teal)"/>
  <text x="212" y="124" font-size="12.5" fill="#0f766e">WebSocket, direct to the negotiated instance</text>

  <!-- Services zone -->
  <rect x="60" y="426" width="960" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="452" font-size="14" font-weight="600" fill="#334155">Business services</text>
  <text x="212" y="452" font-size="13" fill="#64748b">2 replicas each by default · register, heartbeat, deregister · GET /health</text>

  <!-- Services -> Service Discovery -->
  <path d="M1022,470 L1170,470 L1170,368" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-violet)"/>
  <text x="1030" y="462" font-size="12" fill="#6d28d9">register · heartbeat</text>
  <path d="M1240,366 L1240,540 L1024,540" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-violet)"/>
  <text x="1036" y="532" font-size="12" fill="#6d28d9">GET /health every 15 s</text>

  <!-- Service card template: back card (replica) + front card -->
  <!-- Row 1 -->
  <g>
    <rect x="88" y="476" width="215" height="112" rx="10" fill="#e2e8f0" stroke="#cbd5e1"/>
    <rect x="80" y="468" width="215" height="112" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="96" y="496" font-size="15.5" font-weight="700" fill="#0f172a">User Management</text>
    <rect x="96" y="508" width="36" height="20" rx="10" fill="#f3e8ff" stroke="#7e22ce"/><text x="114" y="522" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6b21a8">C#</text>
    <text x="140" y="523" font-size="12" fill="#64748b">Filip</text>
    <text x="96" y="550" font-size="12.5" fill="#334155">Identity, JWT, friends,</text>
    <text x="96" y="567" font-size="12.5" fill="#334155">currency</text>
  </g>
  <g>
    <rect x="323" y="476" width="215" height="112" rx="10" fill="#e2e8f0" stroke="#cbd5e1"/>
    <rect x="315" y="468" width="215" height="112" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="331" y="496" font-size="15.5" font-weight="700" fill="#0f172a">Battle</text>
    <rect x="460" y="482" width="54" height="20" rx="10" fill="#ccfbf1" stroke="#0d9488"/><text x="487" y="496" text-anchor="middle" font-size="11" font-weight="600" fill="#0f766e">WS</text>
    <rect x="331" y="508" width="36" height="20" rx="10" fill="#f3e8ff" stroke="#7e22ce"/><text x="349" y="522" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6b21a8">C#</text>
    <text x="375" y="523" font-size="12" fill="#64748b">Filip</text>
    <text x="331" y="550" font-size="12.5" fill="#334155">Turn-based PvP, damage,</text>
    <text x="331" y="567" font-size="12.5" fill="#334155">rewards</text>
  </g>
  <g>
    <rect x="558" y="476" width="215" height="112" rx="10" fill="#e2e8f0" stroke="#cbd5e1"/>
    <rect x="550" y="468" width="215" height="112" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="566" y="496" font-size="15.5" font-weight="700" fill="#0f172a">Tamagotchi</text>
    <rect x="566" y="508" width="36" height="20" rx="10" fill="#e0f2fe" stroke="#0284c7"/><text x="584" y="522" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0369a1">Go</text>
    <text x="610" y="523" font-size="12" fill="#64748b">Dmitrii</text>
    <text x="566" y="550" font-size="12.5" fill="#334155">Pets, types, XP, ownership,</text>
    <text x="566" y="567" font-size="12.5" fill="#334155">package-local stats</text>
  </g>
  <g>
    <rect x="793" y="476" width="215" height="112" rx="10" fill="#e2e8f0" stroke="#cbd5e1"/>
    <rect x="785" y="468" width="215" height="112" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="801" y="496" font-size="15.5" font-weight="700" fill="#0f172a">Package Registry</text>
    <rect x="801" y="508" width="36" height="20" rx="10" fill="#e0f2fe" stroke="#0284c7"/><text x="819" y="522" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0369a1">Go</text>
    <text x="845" y="523" font-size="12" fill="#64748b">Maxim</text>
    <text x="801" y="550" font-size="12.5" fill="#334155">Packages, stat rules,</text>
    <text x="801" y="567" font-size="12.5" fill="#334155">monster definitions</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="88" y="616" width="215" height="112" rx="10" fill="#e2e8f0" stroke="#cbd5e1"/>
    <rect x="80" y="608" width="215" height="112" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="96" y="636" font-size="15.5" font-weight="700" fill="#0f172a">Map</text>
    <rect x="225" y="622" width="54" height="20" rx="10" fill="#ccfbf1" stroke="#0d9488"/><text x="252" y="636" text-anchor="middle" font-size="11" font-weight="600" fill="#0f766e">WS</text>
    <rect x="96" y="648" width="36" height="20" rx="10" fill="#f3e8ff" stroke="#7e22ce"/><text x="114" y="662" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6b21a8">C#</text>
    <text x="140" y="663" font-size="12" fill="#64748b">Denis</text>
    <text x="96" y="690" font-size="12.5" fill="#334155">Locations, proximity</text>
    <text x="96" y="707" font-size="12.5" fill="#334155">(PostGIS)</text>
  </g>
  <g>
    <rect x="323" y="616" width="215" height="112" rx="10" fill="#e2e8f0" stroke="#cbd5e1"/>
    <rect x="315" y="608" width="215" height="112" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="331" y="636" font-size="15.5" font-weight="700" fill="#0f172a">Monster Raid</text>
    <rect x="460" y="622" width="54" height="20" rx="10" fill="#ccfbf1" stroke="#0d9488"/><text x="487" y="636" text-anchor="middle" font-size="11" font-weight="600" fill="#0f766e">WS</text>
    <rect x="331" y="648" width="36" height="20" rx="10" fill="#f3e8ff" stroke="#7e22ce"/><text x="349" y="662" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6b21a8">C#</text>
    <text x="375" y="663" font-size="12" fill="#64748b">Denis</text>
    <text x="331" y="690" font-size="12.5" fill="#334155">Guild boss raids,</text>
    <text x="331" y="707" font-size="12.5" fill="#334155">live HP, leaderboard</text>
  </g>
  <g>
    <rect x="558" y="616" width="215" height="112" rx="10" fill="#e2e8f0" stroke="#cbd5e1"/>
    <rect x="550" y="608" width="215" height="112" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="566" y="636" font-size="15.5" font-weight="700" fill="#0f172a">Guild</text>
    <rect x="695" y="622" width="54" height="20" rx="10" fill="#ccfbf1" stroke="#0d9488"/><text x="722" y="636" text-anchor="middle" font-size="11" font-weight="600" fill="#0f766e">WS</text>
    <rect x="566" y="648" width="36" height="20" rx="10" fill="#e0f2fe" stroke="#0284c7"/><text x="584" y="662" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0369a1">Go</text>
    <text x="610" y="663" font-size="12" fill="#64748b">Maxim</text>
    <text x="566" y="690" font-size="12.5" fill="#334155">Guilds, roles, invitations,</text>
    <text x="566" y="707" font-size="12.5" fill="#334155">chat</text>
  </g>
  <g>
    <rect x="793" y="616" width="215" height="112" rx="10" fill="#e2e8f0" stroke="#cbd5e1"/>
    <rect x="785" y="608" width="215" height="112" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="801" y="636" font-size="15.5" font-weight="700" fill="#0f172a">Notification</text>
    <rect x="801" y="648" width="36" height="20" rx="10" fill="#e0f2fe" stroke="#0284c7"/><text x="819" y="662" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0369a1">Go</text>
    <text x="845" y="663" font-size="12" fill="#64748b">Dmitrii</text>
    <text x="801" y="690" font-size="12.5" fill="#334155">Events from all services,</text>
    <text x="801" y="707" font-size="12.5" fill="#334155">device push delivery</text>
  </g>

  <!-- Data and external systems -->
  <rect x="80" y="820" width="400" height="70" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="280" y="849" text-anchor="middle" font-size="16" font-weight="600" fill="#92400e">PostgreSQL 16 + PostGIS</text>
  <text x="280" y="871" text-anchor="middle" font-size="12.5" fill="#78716c">one database per service, never shared</text>
  <line x1="280" y1="758" x2="280" y2="816" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="520" y="820" width="275" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="657" y="849" text-anchor="middle" font-size="16" font-weight="600" fill="#991b1b">Redis</text>
  <text x="657" y="871" text-anchor="middle" font-size="12.5" fill="#78716c">guild chat fan-out across replicas</text>
  <line x1="657" y1="758" x2="657" y2="816" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="835" y="820" width="275" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="972" y="849" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">Firebase Cloud Messaging</text>
  <text x="972" y="871" text-anchor="middle" font-size="12.5" fill="#78716c">push to players' devices</text>
  <line x1="892" y1="758" x2="892" y2="816" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="900" y="792" font-size="12" fill="#475569">push</text>

  <!-- Legend -->
  <g font-size="12.5" fill="#475569">
    <line x1="80" y1="944" x2="120" y2="944" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="130" y="948">REST</text>
    <line x1="190" y1="944" x2="230" y2="944" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-violet)"/>
    <text x="240" y="948">Service Discovery traffic</text>
    <line x1="420" y1="944" x2="460" y2="944" stroke="#0d9488" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-teal)"/>
    <text x="470" y="948">WebSocket</text>
    <rect x="565" y="934" width="22" height="18" rx="4" fill="#e2e8f0" stroke="#cbd5e1"/>
    <rect x="560" y="930" width="22" height="18" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <text x="596" y="948">replicated service</text>
    <rect x="720" y="935" width="36" height="20" rx="10" fill="#e0f2fe" stroke="#0284c7"/><text x="738" y="949" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0369a1">Go</text>
    <rect x="762" y="935" width="36" height="20" rx="10" fill="#f3e8ff" stroke="#7e22ce"/><text x="780" y="949" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6b21a8">C#</text>
    <rect x="804" y="935" width="46" height="20" rx="10" fill="#fff7ed" stroke="#ea580c"/><text x="827" y="949" text-anchor="middle" font-size="11.5" font-weight="600" fill="#c2410c">Java</text>
    <text x="860" y="948">language</text>
    <rect x="940" y="935" width="40" height="20" rx="10" fill="#ccfbf1" stroke="#0d9488"/><text x="960" y="949" text-anchor="middle" font-size="11" font-weight="600" fill="#0f766e">WS</text>
    <text x="990" y="948">has a WebSocket channel</text>
    <rect x="1170" y="934" width="30" height="20" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 3"/>
    <text x="1210" y="948">external system</text>
  </g>
</svg>
