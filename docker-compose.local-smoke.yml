# Isolated Guild and Registry checks while other team services are unavailable.
# REST still enters through api-gateway; only external dependencies use local mocks.
services:
  guild-service:
    environment:
      USER_MANAGEMENT_SERVICE_URL: ""
      NOTIFICATION_SERVICE_URL: ""
  package-registry-service:
    environment:
      USER_MANAGEMENT_SERVICE_URL: ""
      TAMAGOTCHI_SERVICE_URL: ""
