# Source builds for reviewing Lab 3 before the versioned images are published.
# docker compose -f docker-compose.yml -f docker-compose.lab3.yml up -d --build
services:
  guild-service:
    build: ./guild-service
    image: tamagotchi-lab3/guild-service:local
  package-registry-service:
    build: ./package-registry
    image: tamagotchi-lab3/package-registry-service:local
  service-discovery:
    build: ./service-discovery
    image: tamagotchi-lab3/service-discovery:local
  api-gateway:
    build: ./api-gateway
    image: tamagotchi-lab3/api-gateway:local
